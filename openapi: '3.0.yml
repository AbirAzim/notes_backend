openapi: '3.0.3'
info:
  title: Note Backend
  version: '1.0'
servers:
  - url: http://localhost:3000/api/v1
    description: local

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Notes
  - name: Posts
  - name: Admins

security:
  - bearerAuth: []

paths:
  /health:
    servers:
      - url: http://localhost:3000
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
